<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1422"><meta name="apple-mobile-web-app-capable" content="yes"><title>配達売上グラフ</title><style>
*{box-sizing:border-box}body{background:#0d1422;color:#f7fafc;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;margin:0}main{max-width:620px;margin:auto;padding:22px 16px 70px}.head{display:flex;align-items:center;gap:15px;margin-bottom:15px}a{color:white;text-decoration:none}.back{background:#2f415b;padding:10px 14px;border-radius:12px}h1{font-size:22px;margin:0}.muted{color:#9eb2cd;font-size:13px}.card{background:#1a263a;border-radius:18px;padding:18px;margin:14px 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{background:#354760;color:#fff;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700}button.on{background:#5daaff;color:#08172c}input{width:100%;background:#101b2e;border:1px solid #465b77;color:white;border-radius:12px;padding:12px;font-size:17px;margin-top:7px}.big{font-size:31px;font-weight:800;margin:4px 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bar{background:#22354d;height:12px;border-radius:6px;overflow:hidden}.bar>div{height:100%;background:#68cfae}.chartframe{overflow-x:auto;padding:6px 0}.chart{display:flex;align-items:flex-end;gap:7px;min-height:240px;border-bottom:1px solid #53637c;padding:12px 0 0;width:100%}.col{min-width:25px;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:225px;position:relative}.bars{height:190px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}.income{width:45%;background:#5ca8ff;border-radius:4px 4px 0 0;min-height:0}.cost{width:45%;background:#f2af72;border-radius:4px 4px 0 0;min-height:0}.axis{font-size:10px;color:#a7b9d2;white-space:nowrap;margin-top:7px;min-height:15px}.legend{display:flex;gap:20px;align-items:center;font-size:13px;margin:8px 0}.dot{width:10px;height:10px;display:inline-block;border-radius:3px;margin-right:6px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #344459;padding:10px 0;gap:8px}.row:last-child{border:0}.empty{color:#a9b9d2;font-size:14px;text-align:center;padding:40px 4px}.hint{color:#a7b8cc;font-size:12px;line-height:1.6}</style></head><body><main><div class="head"><a class="back" href="./">← 戻る</a><div><h1>📈 売上グラフ</h1><div class="muted">記録を見やすく振り返る</div></div></div>
<div class="card"><div class="tabs"><button id="dayBtn">日別</button><button id="monthBtn" class="on">月別</button><button id="yearBtn">年別</button></div><div id="dayPick" hidden><label class="muted">表示する日</label><input type="date" id="day"></div><div id="monthPick"><label class="muted">表示する月</label><input type="month" id="month"></div><div id="yearPick" hidden><label class="muted">表示する年</label><input type="number" min="2020" max="2100" id="year"></div></div>
<div class="card"><div class="muted" id="periodText">売上合計</div><div class="big" id="total">¥0</div><div class="metrics"><div><div class="muted">経費</div><div class="big" id="expense" style="font-size:23px">¥0</div></div><div><div class="muted">差引金額</div><div class="big" id="profit" style="font-size:23px">¥0</div></div></div></div>
<div class="card"><b id="chartTitle">日ごとの推移</b><div class="legend"><span><span class="dot" style="background:#5ca8ff"></span>売上</span><span><span class="dot" style="background:#f2af72"></span>経費</span></div><div class="chartframe"><div id="chart" class="chart"></div></div><div class="hint">青が売上、オレンジが経費です。日別では会社ごとの売上を比較できます。</div></div>
<div class="card"><b>配達会社別の売上</b><div id="companies"></div></div><p class="hint">売上メーターに入力されたデータを読み取るだけです。この画面では売上や経費の記録を変更しません。ホーム画面アプリ間では保存領域が分かれる場合があります。</p>
</main><script>
(()=>{'use strict';const S='delivery-sales-2026-v1',E='delivery-expenses-v1',P='delivery-sales-providers-v1';const $=id=>document.getElementById(id),yen=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP'),pad=n=>String(n).padStart(2,'0'),today=new Date(),d=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());$('day').value=d;$('month').value=d.slice(0,7);$('year').value=today.getFullYear();let mode='month';function read(key,fallback){try{return JSON.parse(localStorage.getItem(key)||'null')??fallback}catch{return fallback}}function namesFor(records){const names=['Uber','ロケット'];const configured=read(P,[]);if(Array.isArray(configured))for(const n of configured)if(typeof n==='string'&&!names.includes(n))names.push(n);for(const item of Object.values(records))for(const n of Object.keys(item?.extra||{}))if(!names.includes(n))names.push(n);return names}function value(item,name){const v=name==='Uber'?item?.uber:name==='ロケット'?item?.rocket:item?.extra?.[name];return Number(v)||0}function filterDate(date){return mode==='day'?date===$('day').value:mode==='month'?date.startsWith($('month').value):date.startsWith($('year').value+'-')}function render(){const sales=read(S,{}),expenses=read(E,[]),validSales=sales&&typeof sales==='object'&&!Array.isArray(sales)?sales:{},validExpenses=Array.isArray(expenses)?expenses:[],names=namesFor(validSales),rows=Object.entries(validSales).filter(([date])=>filterDate(date)),costRows=validExpenses.filter(x=>typeof x.date==='string'&&filterDate(x.date));let total=0,cost=0;const companies=Object.fromEntries(names.map(n=>[n,0]));for(const [,v]of rows){for(const n of names){const a=value(v,n);total+=a;companies[n]+=a}}for(const x of costRows)cost+=Number(x.amount)||0;$('total').textContent=yen(total);$('expense').textContent=yen(cost);$('profit').textContent=yen(total-cost);$('periodText').textContent=mode==='day'?$('day').value:mode==='month'?$('month').value:$('year').value+'年';$('companies').innerHTML='';for(const [n,v]of Object.entries(companies)){const row=document.createElement('div');row.className='row';const t=document.createElement('span');t.textContent=n;const amt=document.createElement('b');amt.textContent=yen(v);row.append(t,amt);$('companies').append(row)}
let points=[];if(mode==='day'){points=names.map(n=>({label:n.length>4?n.slice(0,4):n,sales:companies[n],cost:0}));$('chartTitle').textContent='配達会社ごとの売上'}else if(mode==='month'){const [y,m]=$('month').value.split('-').map(Number),days=new Date(y,m,0).getDate();points=Array.from({length:days},(_,i)=>({label:String(i+1),sales:0,cost:0}));for(const [date,v]of rows){const i=Number(date.slice(8))-1;if(points[i])points[i].sales+=names.reduce((s,n)=>s+value(v,n),0)}for(const x of costRows){const i=Number(x.date.slice(8))-1;if(points[i])points[i].cost+=Number(x.amount)||0}$('chartTitle').textContent='日ごとの売上・経費'}else{points=Array.from({length:12},(_,i)=>({label:String(i+1)+'月',sales:0,cost:0}));for(const [date,v]of rows){const i=Number(date.slice(5,7))-1;if(points[i])points[i].sales+=names.reduce((s,n)=>s+value(v,n),0)}for(const x of costRows){const i=Number(x.date.slice(5,7))-1;if(points[i])points[i].cost+=Number(x.amount)||0}$('chartTitle').textContent='月ごとの売上・経費'}
const chart=$('chart');chart.innerHTML='';chart.style.minWidth=mode==='month'?'850px':'0';if(!points.some(p=>p.sales||p.cost)){chart.innerHTML='<div class="empty" style="width:100%">この期間の記録はまだありません</div>';return}const max=Math.max(1,...points.map(p=>Math.max(p.sales,p.cost)));for(const point of points){const col=document.createElement('div');col.className='col';const bars=document.createElement('div');bars.className='bars';bars.title=point.label+' 売上 '+yen(point.sales)+' / 経費 '+yen(point.cost);const blue=document.createElement('div');blue.className='income';blue.style.height=(point.sales/max*100)+'%';const orange=document.createElement('div');orange.className='cost';orange.style.height=(point.cost/max*100)+'%';bars.append(blue,orange);const axis=document.createElement('div');axis.className='axis';axis.textContent=point.label;col.append(bars,axis);chart.append(col)}}
function changeMode(next){mode=next;for(const [name,id]of [['day','dayPick'],['month','monthPick'],['year','yearPick']])$(id).hidden=name!==next;for(const [name,id]of [['day','dayBtn'],['month','monthBtn'],['year','yearBtn']])$(id).className=name===next?'on':'';render()}$('dayBtn').onclick=()=>changeMode('day');$('monthBtn').onclick=()=>changeMode('month');$('yearBtn').onclick=()=>changeMode('year');for(const id of ['day','month','year'])$(id).onchange=render;window.addEventListener('pageshow',render);render()})();
</script></body></html>
