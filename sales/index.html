<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="配達売上"><meta name="theme-color" content="#101827"><title>配達売上（修正版）</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d1422;color:#f7fafc;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{max-width:570px;margin:auto;padding:25px 17px 70px}.muted{color:#9aacc4}.hero{background:linear-gradient(125deg,#1f3b62,#152137);padding:25px 20px;border-radius:22px;margin:18px 0}h1{font-size:23px;margin:0}.big{font-size:37px;font-weight:800;margin:6px 0}.card{background:#1a2537;border-radius:18px;padding:18px;margin:14px 0}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.twocol .card{margin:0}label{display:block;color:#c9d7e8;margin:12px 0 5px;font-size:14px}input{width:100%;font-size:20px;background:#0f1a2b;color:white;border:1px solid #42536b;border-radius:12px;padding:12px}button{border:0;border-radius:12px;padding:13px 18px;background:#4e9cff;color:#081525;font-size:17px;font-weight:bold;width:100%;margin-top:15px}.secondary{background:#2e3d52;color:#fff}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #324155;padding:11px 0;gap:10px}.item:last-child{border:0}.mini{font-size:13px}.remove{width:auto;padding:7px 11px;background:#583044;color:#fff;margin:0;font-size:12px}.bar{height:12px;background:#354359;border-radius:8px;overflow:hidden}.fill{height:100%;background:#66d1aa;width:0}</style></head>
<body><main><h1>🚴 配達売上メーター</h1><div style="margin:10px 0"><a href="../manage/" style="display:block;background:#2e4059;color:white;text-decoration:none;text-align:center;border-radius:12px;padding:12px;font-weight:700">📊 新しい配達管理へ</a></div><div class="muted mini">修正版 2026.11.15.3 ／ 月別・日別表示</div><div class="muted mini">Uber・ロケット・追加した配達会社の売上</div><div style="margin-top:14px"><a href="../expenses/" style="display:block;background:#2e4059;color:white;border-radius:12px;padding:13px;text-align:center;text-decoration:none;font-weight:700">🧾 経費管理・利益を見る</a></div>
<div class="card"><b>売上を見る</b><div class="twocol"><button id="modeMonth" type="button">月別</button><button class="secondary" id="modeDay" type="button">日別</button></div><div id="monthChooser"><label>表示する月</label><input type="month" id="viewMonth"></div><div id="dayChooser" style="display:none"><label>表示する日</label><input type="date" id="viewDay"></div></div><div class="hero"><div class="muted" id="totalTitle">月間売上合計</div><div class="big" id="total">¥0</div><div class="muted" id="goaltext"></div><div class="bar"><div class="fill" id="progress"></div></div></div>
<div class="twocol" id="providerTotals"></div>
<div class="card"><b>売上を記録</b><label>日付</label><input type="date" id="day"><div class="twocol" id="providerInputs"></div><button id="save">この日の売上を保存</button><div class="muted mini" style="margin-top:9px">同じ日付で保存するとその日の金額を更新します。</div></div>
<div class="card"><b>配達会社を追加</b><label>追加する会社名</label><input id="newProvider" maxlength="40" placeholder="例：出前館"><button class="secondary" id="addProvider" type="button">会社を追加</button><div class="mini muted">登録した会社は売上入力欄に追加されます。過去の売上も残ります。</div></div><div class="card"><b id="historyTitle">日付別の内訳（1日から順）</b><div id="history"></div></div>
<div class="card"><b>目標設定</b><label>月間売上目標（円）</label><input id="goal" type="number" min="1" inputmode="numeric" value="600000"><button class="secondary" id="savegoal">目標を保存</button></div>
<div class="card"><b>データをバックアップ</b><button class="secondary" id="export">JSONを保存</button><label>バックアップを復元</label><input id="import" type="file" accept=".json,application/json" style="font-size:13px"></div><p class="muted mini">端末内にデータを保存します。Safariのデータ削除や機種変更に備えて、ときどきバックアップしてください。売上は経費控除前です。</p></main>
<script>
(()=>{'use strict';const KEY='delivery-sales-2026-v1',GKEY='delivery-sales-goal';const $=id=>document.getElementById(id);const yen=v=>'¥'+Number(v||0).toLocaleString('ja-JP');const pad=n=>String(n).padStart(2,'0');const now=new Date();const today=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());$('day').value=today;$('viewMonth').value=today.slice(0,7);$('viewDay').value=today;let mode='month';let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch{data=null}if(!data||typeof data!=='object'||Array.isArray(data))data={};if(Object.keys(data).length===0){data['2026-11-14']={uber:19985,rocket:0};data['2026-11-15']={uber:34887,rocket:0};localStorage.setItem(KEY,JSON.stringify(data))} $('goal').value=localStorage.getItem(GKEY)||'600000';const PKEY='delivery-sales-providers-v1';function providerList(){let p;try{p=JSON.parse(localStorage.getItem(PKEY)||'null')}catch{p=null}const list=['Uber','ロケット'];if(Array.isArray(p))for(const s of p){if(typeof s==='string'&&s.trim()&&!list.includes(s.trim()))list.push(s.trim())}return list}function providersFromData(records){const names=providerList();for(const v of Object.values(records||{})){if(v&&v.extra&&typeof v.extra==='object')for(const k of Object.keys(v.extra)){if(!names.includes(k))names.push(k)}}return names}function companyValue(v,name){if(!v)return 0;const n=name==='Uber'?v.uber:name==='ロケット'?v.rocket:v.extra?.[name];return Number(n)||0}function companyTotal(v){return providersFromData({one:v}).reduce((a,k)=>a+companyValue(v,k),0)}function writeCompanies(v,values){const next={...v,extra:{...(v?.extra||{})}};for(const [k,n]of Object.entries(values)){if(k==='Uber')next.uber=n;else if(k==='ロケット')next.rocket=n;else next.extra[k]=n}return next}function saveProviders(names){localStorage.setItem(PKEY,JSON.stringify(names))};const store=()=>localStorage.setItem(KEY,JSON.stringify(data));function inputFields(){const names=providersFromData(data);$('providerInputs').innerHTML='';for(const name of names){const wrap=document.createElement('div');const label=document.createElement('label');label.textContent=name+'（円）';const input=document.createElement('input');input.type='number';input.min='0';input.inputMode='numeric';input.placeholder='0';input.dataset.company=name;wrap.append(label,input);$('providerInputs').append(wrap)}}function currentValues(){const vals={};for(const x of $('providerInputs').querySelectorAll('input[data-company]'))vals[x.dataset.company]=Number(x.value||0);return vals}function loadDay(){const v=data[$('day').value]||{};for(const x of $('providerInputs').querySelectorAll('input[data-company]'))x.value=companyValue(v,x.dataset.company)||''}function render(){const m=$('viewMonth').value,selected=$('viewDay').value,rows=Object.entries(data).filter(([d])=>mode==='month'?d.startsWith(m):d===selected).sort((a,b)=>a[0].localeCompare(b[0]));const names=providersFromData(data),totals=Object.fromEntries(names.map(n=>[n,0]));for(const [,v]of rows)for(const n of names)totals[n]+=companyValue(v,n);const sum=Object.values(totals).reduce((a,b)=>a+b,0),goal=Math.max(1,Number($('goal').value)||600000);$('totalTitle').textContent=mode==='month'?'月間売上合計':'選択日の売上合計';$('historyTitle').textContent=mode==='month'?'日付別の内訳（1日から順）':'選択した日の内訳';$('total').textContent=yen(sum);$('providerTotals').innerHTML='';for(const n of names){const card=document.createElement('div');card.className='card';const label=document.createElement('div');label.className='muted mini';label.textContent=n;const amount=document.createElement('h2');amount.textContent=yen(totals[n]);card.append(label,amount);$('providerTotals').append(card)}$('goaltext').textContent=mode==='month'?'目標 '+yen(goal)+' ／ 達成率 '+(sum/goal*100).toFixed(1)+'% ／ 残り '+yen(Math.max(0,goal-sum)):'選択日 '+selected+' ／ 月の目標 '+yen(goal);$('progress').style.width=Math.min(100,sum/goal*100)+'%';$('history').innerHTML='';if(!rows.length){$('history').textContent=mode==='month'?'この月の記録はまだありません':'この日の記録はまだありません';return}for(const [day,v]of rows){const el=document.createElement('div');el.className='item';const info=document.createElement('div');info.innerHTML='<b>'+day.slice(5).replace('-','/')+'　'+yen(companyTotal(v))+'</b><div class="mini muted">'+names.map(n=>n+' '+yen(companyValue(v,n))).join(' ／ ')+'</div>';info.style.cursor='pointer';info.onclick=()=>{$('day').value=day;loadDay();window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='remove';del.textContent='削除';del.onclick=()=>{if(confirm(day+'の記録を削除しますか？')){delete data[day];store();render()}};el.append(info,del);$('history').appendChild(el)}}$('save').onclick=()=>{const day=$('day').value,values=currentValues();if(!day||!Object.values(values).every(n=>Number.isSafeInteger(n)&&n>=0)){alert('日付と0円以上の金額を入力してください');return}data[day]=writeCompanies(data[day]||{},values);store();$('viewMonth').value=day.slice(0,7);$('viewDay').value=day;render();alert('保存しました')};$('day').onchange=loadDay;$('addProvider').onclick=()=>{const name=$('newProvider').value.trim();if(!name||name.length>40){alert('会社名を入力してください');return}const names=providersFromData(data);if(names.includes(name)){alert('登録済みです');return}names.push(name);saveProviders(names);$('newProvider').value='';inputFields();loadDay();render()};$('viewMonth').onchange=render;$('viewDay').onchange=render;function setMode(next){mode=next;$('monthChooser').style.display=mode==='month'?'block':'none';$('dayChooser').style.display=mode==='day'?'block':'none';$('modeMonth').className=mode==='month'?'':'secondary';$('modeDay').className=mode==='day'?'':'secondary';render()}$('modeMonth').onclick=()=>setMode('month');$('modeDay').onclick=()=>setMode('day');$('savegoal').onclick=()=>{localStorage.setItem(GKEY,$('goal').value);render()};$('export').onclick=()=>{const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify({data,goal:$('goal').value},null,2)],{type:'application/json'}));a.href=url;a.download='delivery-sales-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};$('import').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!v.data||typeof v.data!=='object'||Array.isArray(v.data))throw Error('形式不一致');if(confirm('現在の記録をバックアップ内容に置き換えますか？')){data=v.data;store();if(v.goal){$('goal').value=v.goal;localStorage.setItem(GKEY,v.goal)}inputFields();loadDay();render()}}catch{alert('バックアップファイルを読み込めませんでした')}};inputFields();loadDay();render()})();
</script></body></html>
