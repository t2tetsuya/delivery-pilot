<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="配達売上"><meta name="theme-color" content="#101827"><title>配達売上（修正版）</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d1422;color:#f7fafc;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{max-width:570px;margin:auto;padding:25px 17px 70px}.muted{color:#9aacc4}.hero{background:linear-gradient(125deg,#1f3b62,#152137);padding:25px 20px;border-radius:22px;margin:18px 0}h1{font-size:23px;margin:0}.big{font-size:37px;font-weight:800;margin:6px 0}.card{background:#1a2537;border-radius:18px;padding:18px;margin:14px 0}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.twocol .card{margin:0}label{display:block;color:#c9d7e8;margin:12px 0 5px;font-size:14px}input{width:100%;font-size:20px;background:#0f1a2b;color:white;border:1px solid #42536b;border-radius:12px;padding:12px}button{border:0;border-radius:12px;padding:13px 18px;background:#4e9cff;color:#081525;font-size:17px;font-weight:bold;width:100%;margin-top:15px}.secondary{background:#2e3d52;color:#fff}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #324155;padding:11px 0;gap:10px}.item:last-child{border:0}.mini{font-size:13px}.remove{width:auto;padding:7px 11px;background:#583044;color:#fff;margin:0;font-size:12px}.bar{height:12px;background:#354359;border-radius:8px;overflow:hidden}.fill{height:100%;background:#66d1aa;width:0}</style></head>
<body><main><h1>🚴 配達売上メーター</h1><div style="margin:10px 0"><a href="../manage/" style="display:block;background:#2e4059;color:white;text-decoration:none;text-align:center;border-radius:12px;padding:12px;font-weight:700">📊 新しい配達管理へ</a></div><div class="muted mini">修正版 2026.11.15.3 ／ 月別・日別表示</div><div class="muted mini">Uber Eats ＋ ロケットナウ</div><div style="margin-top:14px"><a href="../expenses/" style="display:block;background:#2e4059;color:white;border-radius:12px;padding:13px;text-align:center;text-decoration:none;font-weight:700">🧾 経費管理・利益を見る</a></div>
<div class="card"><b>売上を見る</b><div class="twocol"><button id="modeMonth" type="button">月別</button><button class="secondary" id="modeDay" type="button">日別</button></div><div id="monthChooser"><label>表示する月</label><input type="month" id="viewMonth"></div><div id="dayChooser" style="display:none"><label>表示する日</label><input type="date" id="viewDay"></div></div><div class="hero"><div class="muted" id="totalTitle">月間売上合計</div><div class="big" id="total">¥0</div><div class="muted" id="goaltext"></div><div class="bar"><div class="fill" id="progress"></div></div></div>
<div class="twocol"><div class="card"><div class="muted mini">Uber</div><h2 id="utotal">¥0</h2></div><div class="card"><div class="muted mini">ロケット</div><h2 id="rtotal">¥0</h2></div></div>
<div class="card"><b>売上を記録</b><label>日付</label><input type="date" id="day"><div class="twocol"><div><label>Uber（円）</label><input id="uber" inputmode="numeric" type="number" min="0" placeholder="0"></div><div><label>ロケット（円）</label><input id="rocket" inputmode="numeric" type="number" min="0" placeholder="0"></div></div><button id="save">この日の売上を保存</button><div class="muted mini" style="margin-top:9px">同じ日付で保存するとその日の金額を更新します。</div></div>
<div class="card"><b id="historyTitle">日付別の内訳（1日から順）</b><div id="history"></div></div>
<div class="card"><b>目標設定</b><label>月間売上目標（円）</label><input id="goal" type="number" min="1" inputmode="numeric" value="600000"><button class="secondary" id="savegoal">目標を保存</button></div>
<div class="card"><b>データをバックアップ</b><button class="secondary" id="export">JSONを保存</button><label>バックアップを復元</label><input id="import" type="file" accept=".json,application/json" style="font-size:13px"></div><p class="muted mini">端末内にデータを保存します。Safariのデータ削除や機種変更に備えて、ときどきバックアップしてください。売上は経費控除前です。</p></main>
<script>
(()=>{'use strict';const KEY='delivery-sales-2026-v1',GKEY='delivery-sales-goal';const $=id=>document.getElementById(id);const yen=v=>'¥'+Number(v||0).toLocaleString('ja-JP');const pad=n=>String(n).padStart(2,'0');const now=new Date();const today=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());$('day').value=today;$('viewMonth').value=today.slice(0,7);$('viewDay').value=today;let mode='month';let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch{data=null}if(!data||typeof data!=='object'||Array.isArray(data))data={};if(Object.keys(data).length===0){data['2026-11-14']={uber:19985,rocket:0};data['2026-11-15']={uber:34887,rocket:0};localStorage.setItem(KEY,JSON.stringify(data))} $('goal').value=localStorage.getItem(GKEY)||'600000';const store=()=>localStorage.setItem(KEY,JSON.stringify(data));function render(){const m=$('viewMonth').value,selected=$('viewDay').value,rows=Object.entries(data).filter(([d])=>mode==='month'?d.startsWith(m):d===selected).sort((a,b)=>a[0].localeCompare(b[0]));let u=0,r=0;for(const [,v]of rows){u+=Number(v.uber)||0;r+=Number(v.rocket)||0}const sum=u+r,goal=Math.max(1,Number($('goal').value)||600000);$('totalTitle').textContent=mode==='month'?'月間売上合計':'選択日の売上合計';$('historyTitle').textContent=mode==='month'?'日付別の内訳（1日から順）':'選択した日の内訳';$('total').textContent=yen(sum);$('utotal').textContent=yen(u);$('rtotal').textContent=yen(r);$('goaltext').textContent=mode==='month'?'目標 '+yen(goal)+' ／ 達成率 '+(sum/goal*100).toFixed(1)+'% ／ 残り '+yen(Math.max(0,goal-sum)):'選択日 '+selected+' ／ 月の目標 '+yen(goal);$('progress').style.width=Math.min(100,sum/goal*100)+'%';$('history').innerHTML='';if(!rows.length){$('history').textContent=mode==='month'?'この月の記録はまだありません':'この日の記録はまだありません';return}for(const [day,v]of rows){const el=document.createElement('div');el.className='item';const info=document.createElement('div');info.innerHTML='<b>'+day.slice(5).replace('-','/')+'　'+yen((Number(v.uber)||0)+(Number(v.rocket)||0))+'</b><div class="mini muted">Uber '+yen(v.uber)+' ／ ロケット '+yen(v.rocket)+'</div>';info.style.cursor='pointer';info.onclick=()=>{$('day').value=day;$('uber').value=v.uber||0;$('rocket').value=v.rocket||0;window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='remove';del.textContent='削除';del.onclick=()=>{if(confirm(day+'の記録を削除しますか？')){delete data[day];store();render()}};el.append(info,del);$('history').appendChild(el)}}$('save').onclick=()=>{const day=$('day').value,u=Number($('uber').value||0),r=Number($('rocket').value||0);if(!day||!Number.isFinite(u)||!Number.isFinite(r)||u<0||r<0){alert('日付と0円以上の金額を入力してください');return}data[day]={uber:Math.round(u),rocket:Math.round(r)};store();$('viewMonth').value=day.slice(0,7);$('viewDay').value=day;render();alert('保存しました')};$('day').onchange=()=>{const v=data[$('day').value]||{};$('uber').value=v.uber??'';$('rocket').value=v.rocket??''};$('viewMonth').onchange=render;$('viewDay').onchange=render;function setMode(next){mode=next;$('monthChooser').style.display=mode==='month'?'block':'none';$('dayChooser').style.display=mode==='day'?'block':'none';$('modeMonth').className=mode==='month'?'':'secondary';$('modeDay').className=mode==='day'?'':'secondary';render()}$('modeMonth').onclick=()=>setMode('month');$('modeDay').onclick=()=>setMode('day');$('savegoal').onclick=()=>{localStorage.setItem(GKEY,$('goal').value);render()};$('export').onclick=()=>{const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify({data,goal:$('goal').value},null,2)],{type:'application/json'}));a.href=url;a.download='delivery-sales-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};$('import').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!v.data||typeof v.data!=='object'||Array.isArray(v.data))throw Error('形式不一致');if(confirm('現在の記録をバックアップ内容に置き換えますか？')){data=v.data;store();if(v.goal){$('goal').value=v.goal;localStorage.setItem(GKEY,v.goal)}render()}}catch{alert('バックアップファイルを読み込めませんでした')}};render()})();
</script></body></html>
